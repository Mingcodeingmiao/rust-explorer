name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Format, core tests and desktop compilation
        shell: pwsh
        # Hosted runners have no interactive Explorer desktop. Compile the OLE
        # fixture here; execute it with a deadline on the release-test desktop.
        run: ./scripts/check.ps1 -SkipInteractiveShellTests
